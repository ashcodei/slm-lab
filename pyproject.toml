[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-lab"
version = "0.1.0"
description = "From-scratch sub-billion-parameter text-and-image model research"
requires-python = ">=3.11"
dependencies = ["torch>=2.6", "pillow>=10"]

[project.optional-dependencies]
data = ["datasets>=3", "tokenizers>=0.21", "mwparserfromhell>=0.7", "pypdfium2==5.14.0", "google-crc32c==1.9.0"]
dev = ["pytest>=8"]
eval = ["quickjs==1.19.4", "pyahocorasick>=2.3"]

[project.scripts]
slm-budget = "slm_lab.budget:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
